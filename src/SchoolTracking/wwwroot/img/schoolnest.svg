<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  role="img"
  aria-labelledby="schoolnest-title schoolnest-desc"
  class="schoolnest-mark"
>
  <title id="schoolnest-title">SchoolNest owl</title>
  <desc id="schoolnest-desc">A friendly owl peeking out of a woven nest.</desc>

  <!-- Theme tokens are sn-primary, sn-accent, sn-ink, and sn-face CSS custom properties. -->
  <style>
    .sn-primary { fill: var(--sn-primary, #6557c8); }
    .sn-accent { fill: var(--sn-accent, #f2ae3e); }
    .sn-ink { fill: var(--sn-ink, #25213a); }
    .sn-face { fill: var(--sn-face, #fff9ee); }
    .sn-detail {
      fill: none;
      stroke: var(--sn-ink, #25213a);
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @media (forced-colors: active) {
      .sn-primary,
      .sn-accent,
      .sn-ink { fill: CanvasText; }
      .sn-face { fill: Canvas; }
      .sn-detail { stroke: CanvasText; }
    }
  </style>

  <!-- Owl silhouette -->
  <path
    class="sn-primary"
    d="M113 190C88 134 106 78 154 46c13 39 40 55 69 40 21-11 45-11 66 0 29 15 56-1 69-40 48 32 66 88 41 144 23 29 35 65 32 103-5 67-42 119-96 145-24 12-51 18-79 18s-55-6-79-18c-54-26-91-78-96-145-3-38 9-74 32-103Z"
  />

  <!-- Quiet wing shapes keep the icon readable without adding another color. -->
  <path
    d="M128 269c-2 59 25 111 74 142-5-64-18-115-52-157-10 2-17 7-22 15Z"
    fill="var(--sn-ink, #25213a)"
    opacity=".16"
  />
  <path
    d="M384 269c2 59-25 111-74 142 5-64 18-115 52-157 10 2 17 7 22 15Z"
    fill="var(--sn-ink, #25213a)"
    opacity=".16"
  />

  <!-- Soft heart-shaped facial patch -->
  <path
    class="sn-face"
    d="M256 284c-23 30-68 28-99-2-35-33-35-88-5-121 27-30 72-31 104-2 32-29 77-28 104 2 30 33 30 88-5 121-31 30-76 32-99 2Z"
  />

  <!-- Eye rings -->
  <circle cx="202" cy="211" r="43" fill="none" stroke="var(--sn-primary, #6557c8)" stroke-width="12" />
  <circle cx="310" cy="211" r="43" fill="none" stroke="var(--sn-primary, #6557c8)" stroke-width="12" />

  <!-- Eyes -->
  <circle class="sn-ink" cx="202" cy="211" r="22" />
  <circle class="sn-ink" cx="310" cy="211" r="22" />
  <circle class="sn-face" cx="194" cy="203" r="7" />
  <circle class="sn-face" cx="302" cy="203" r="7" />

  <!-- Beak -->
  <path class="sn-accent" d="M256 226l25 20-25 32-25-32 25-20Z" />

  <!-- Nest base: a shallow, irregular bowl rather than a geometric basket. -->
  <path
    class="sn-accent"
    d="M86 367c48-28 104-40 170-39 66-1 122 11 170 39-9 35-33 64-69 84-28 15-62 23-101 23s-73-8-101-23c-36-20-60-49-69-84Z"
  />

  <!-- The darker opening tucks the owl into the nest. -->
  <path
    d="M91 367c45-30 103-43 165-42 62-1 120 12 165 42-43 23-98 34-165 34S134 390 91 367Z"
    fill="var(--sn-ink, #25213a)"
    opacity=".18"
  />

  <!-- A subtle lower shadow rounds the nest without adding another theme color. -->
  <path
    d="M111 407c42 25 90 37 145 37s103-12 145-37c-24 41-77 67-145 67s-121-26-145-67Z"
    fill="var(--sn-ink, #25213a)"
    opacity=".12"
  />

  <!-- Little feet now sit between the opening and the woven rim. -->
  <path class="sn-detail" stroke-width="10" d="M211 354v24m-17-7 17 7 17-7M301 354v24m-17-7 17 7 17-7" />

  <!-- Layered, curved twigs create an organic weave. -->
  <path class="sn-detail" stroke-width="15" opacity=".74" d="M92 369c47-24 102-34 164-33 62-1 117 9 164 33" />
  <path class="sn-detail" stroke-width="12" opacity=".62" d="M99 359c48 24 102 34 162 30 61-4 113-18 155-42" />
  <path class="sn-detail" stroke-width="12" opacity=".66" d="M106 392c47-23 101-31 159-26 58 4 105 21 141 48" />
  <path class="sn-detail" stroke-width="11" opacity=".62" d="M121 420c47-23 99-30 154-24 50 5 89 19 116 40" />
  <path class="sn-detail" stroke-width="10" opacity=".58" d="M157 449c31-21 69-30 112-26 37 3 68 13 91 29" />
  <path class="sn-detail" stroke-width="10" opacity=".48" d="M111 378c39 36 89 59 151 70M401 377c-40 36-91 60-153 73" />

  <!-- A few short ends keep the silhouette twig-like. -->
  <path class="sn-detail" stroke-width="11" opacity=".7" d="M101 375 75 360M410 375l28-18" />
</svg>
