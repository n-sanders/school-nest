<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Catalog — School Nest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Caveat:wght@600;700&family=Chewy&family=Comic+Neue:wght@400;700&family=Courier+Prime:wght@400;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Fredoka:wght@500;600;700&family=Lora:wght@400;600;700&family=Nunito:wght@400;600;700&family=Patrick+Hand&family=Quicksand:wght@400;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/site.css" />
  <link rel="icon" type="image/svg+xml" href="/img/schoolnest.svg" />
  <script src="/js/themes.js"></script>
  <script src="/js/theme.js"></script>
</head>
<body>
  <div class="shell">
    <div class="topbar" id="topbar"></div>
    <div id="flash" hidden></div>

    <div class="panel catalog-browse">
      <h1>Family catalog</h1>
      <div id="tree"></div>
    </div>

    <div class="panel">
      <h2>Add subject</h2>
      <form id="subjectForm" class="row">
        <label>Name <input id="subjectName" required /></label>
        <button type="submit">Add subject</button>
      </form>
    </div>

    <div class="panel">
      <h2>Add course</h2>
      <form id="courseForm" class="row">
        <label>Subject <select id="courseSubject" required></select></label>
        <label>Name <input id="courseName" required /></label>
        <button type="submit">Add course</button>
      </form>
    </div>

    <div class="panel">
      <h2>Add catalog assignment</h2>
      <form id="itemForm" class="row">
        <label>Course <select id="itemCourse" required></select></label>
        <label>Name <input id="itemName" required /></label>
        <label>URL <input id="itemUrl" placeholder="https://..." /></label>
        <label>Default effort <span id="itemEffortWrap"></span></label>
        <label>Description <textarea id="itemDesc"></textarea></label>
        <button type="submit">Add assignment</button>
      </form>
    </div>
  </div>
  <script src="/js/app.js"></script>
  <script>
    document.getElementById("itemEffortWrap").innerHTML = effortSelect("itemEffort", "low");

    async function refresh() {
      const me = await requireAuth("parent");
      await renderTopbar(me, "catalog");
      const tree = await api.get("/api/catalog/tree");
      document.getElementById("tree").innerHTML = tree.length ? `
        <div class="catalog-tree">
          ${tree.map(s => `
            <section class="catalog-subject">
              <h3 class="catalog-subject-heading">${s.name}</h3>
              ${s.courses.map(c => `
                <div class="catalog-course">
                  <div class="catalog-course-name">${c.name}</div>
                  <ul class="catalog-assignments">
                    ${c.assignments.map(a => `
                      <li>
                        <span>${a.name} · ${a.defaultEffort}</span>
                        ${a.url ? ` · <a href="${a.url}" target="_blank" rel="noopener">link</a>` : ""}
                        ${a.description ? `<div class="muted catalog-assignment-desc">${a.description}</div>` : ""}
                      </li>
                    `).join("") || `<li class="muted">No assignments</li>`}
                  </ul>
                </div>
              `).join("") || `<p class="muted">No courses</p>`}
            </section>
          `).join("")}
        </div>
      ` : `<p class="muted">No subjects yet.</p>`;

      document.getElementById("courseSubject").innerHTML =
        tree.map(s => `<option value="${s.id}">${s.name}</option>`).join("");

      const courseOptions = [];
      for (const s of tree) {
        for (const c of s.courses) {
          courseOptions.push(`<option value="${c.id}">${s.name} / ${c.name}</option>`);
        }
      }
      document.getElementById("itemCourse").innerHTML = courseOptions.join("");
    }

    document.getElementById("subjectForm").onsubmit = async (e) => {
      e.preventDefault();
      try {
        await api.post("/api/catalog/subjects", { name: document.getElementById("subjectName").value });
        document.getElementById("subjectName").value = "";
        await refresh();
      } catch (err) { showFlash(document.getElementById("flash"), err.message, true); }
    };

    document.getElementById("courseForm").onsubmit = async (e) => {
      e.preventDefault();
      try {
        await api.post("/api/catalog/courses", {
          subjectId: Number(document.getElementById("courseSubject").value),
          name: document.getElementById("courseName").value
        });
        document.getElementById("courseName").value = "";
        await refresh();
      } catch (err) { showFlash(document.getElementById("flash"), err.message, true); }
    };

    document.getElementById("itemForm").onsubmit = async (e) => {
      e.preventDefault();
      try {
        await api.post("/api/catalog/assignments", {
          courseId: Number(document.getElementById("itemCourse").value),
          name: document.getElementById("itemName").value,
          url: document.getElementById("itemUrl").value,
          description: document.getElementById("itemDesc").value,
          defaultEffort: document.querySelector('select[name="itemEffort"]').value
        });
        document.getElementById("itemName").value = "";
        document.getElementById("itemUrl").value = "";
        document.getElementById("itemDesc").value = "";
        await refresh();
      } catch (err) { showFlash(document.getElementById("flash"), err.message, true); }
    };

    refresh().catch(() => {});
  </script>
</body>
</html>
