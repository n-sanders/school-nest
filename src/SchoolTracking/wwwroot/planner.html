<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Planner — School Nest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Caveat:wght@600;700&family=Chewy&family=Comic+Neue:wght@400;700&family=Courier+Prime:wght@400;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Fredoka:wght@500;600;700&family=Lora:wght@400;600;700&family=Nunito:wght@400;600;700&family=Patrick+Hand&family=Quicksand:wght@400;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/site.css" />
  <link rel="icon" type="image/svg+xml" href="/img/schoolnest.svg" />
  <script src="/js/themes.js"></script>
  <script src="/js/theme.js"></script>
</head>
<body>
  <div class="shell">
    <div class="topbar" id="topbar"></div>
    <div id="flash" hidden></div>

    <div class="panel planner-intro">
      <h1>Day planner</h1>
      <p class="muted">Drag a subject onto a day card — or click a subject, then click a day.</p>
    </div>

    <div class="planner-layout">
      <aside class="planner-sidebar">
        <div class="panel subject-rail">
          <h2>Subjects</h2>
          <div class="subject-chips" id="subjectChips"></div>
          <button type="button" class="planner-add-subject" id="addSubjectBtn">+ subject</button>
        </div>
        <div class="panel template-rail">
          <h2>Day plan</h2>
          <div class="template-chip-wrap">
            <button type="button" class="template-chip" id="templateChip" draggable="true">Day plan</button>
          </div>
          <p class="muted template-hint">Drop on a day to add that kid's plan.</p>
          <button type="button" class="planner-add-subject" id="editTemplateBtn">edit plans</button>
        </div>
        <details class="panel course-rail" id="courseRail">
          <summary class="course-rail-summary">
            <span class="course-rail-title">Courses</span>
          </summary>
          <ul class="course-list" id="courseList"></ul>
        </details>
      </aside>
      <div id="childRows"></div>
    </div>

    <dialog id="pickerDialog" class="picker-dialog">
      <form id="pickerForm">
        <h2 id="pickerTitle">Add assignment</h2>
        <label id="pickerCourseLabel">Course
          <select id="pickerCourse"></select>
        </label>
        <label id="pickerAssignmentLabel">Assignment
          <select id="pickerAssignment"></select>
        </label>
        <label id="pickerEffortLabel">Effort
          <span id="pickerEffortWrap"></span>
        </label>
        <p class="muted" id="pickerNote" hidden></p>
        <div class="actions">
          <button type="submit" id="pickerSubmit">Add</button>
          <button type="button" class="secondary" id="pickerCancel">Cancel</button>
        </div>
      </form>
    </dialog>

    <dialog id="templateDialog" class="picker-dialog template-dialog">
      <form id="templateForm">
        <h2>Edit day plan</h2>
        <label>Kid
          <select id="templateStudent"></select>
        </label>
        <div class="template-items" id="templateItems"></div>
        <p class="muted" id="templateNote" hidden></p>
        <button type="button" class="planner-add-subject template-add-item" id="templateAddItem">+ add item</button>
        <div class="actions">
          <button type="submit" id="templateSave">Save</button>
          <button type="button" class="secondary" id="templateCancel">Cancel</button>
          <button type="button" class="danger" id="templateClear">Clear plan</button>
        </div>
      </form>
    </dialog>
  </div>
  <script src="/js/app.js"></script>
  <script src="/js/planner.js"></script>
</body>
</html>
