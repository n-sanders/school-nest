<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Magic words — School Nest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Caveat:wght@600;700&family=Comic+Neue:wght@400;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&family=Quicksand:wght@400;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/site.css" />
  <link rel="icon" type="image/svg+xml" href="/img/schoolnest.svg" />
  <script src="/js/themes.js"></script>
  <script src="/js/theme.js"></script>
</head>
<body>
  <div class="shell">
    <div class="topbar" id="topbar"></div>
    <div id="flash" hidden></div>
    <div class="panel">
      <h1>Magic words</h1>
      <p class="muted">Change your own magic word, or any student's. Other parents manage their own words.</p>
      <ul class="list" id="list"></ul>
    </div>
  </div>
  <script src="/js/app.js"></script>
  <script>
    async function refresh() {
      const me = await requireAuth("parent");
      await renderTopbar(me, "magic");
      const users = await api.get("/api/family/magic-words");
      const list = document.getElementById("list");
      list.innerHTML = users.map(u => `
        <li>
          <div><strong>${u.displayName}</strong> <span class="muted">(${u.role}${u.isSelf ? ", you" : ""})</span></div>
          <div class="actions">
            <label>Magic word
              <input data-word-for="${u.id}" value="${u.magicWord.replaceAll('"', '&quot;')}" ${u.role === "parent" && !u.isSelf ? "disabled" : ""} />
            </label>
            ${u.role === "parent" && !u.isSelf
              ? `<span class="muted">Only ${u.displayName} can change this</span>`
              : `<button data-save="${u.id}" type="button">Save</button>`}
          </div>
        </li>
      `).join("");

      list.onclick = async (e) => {
        const t = e.target;
        if (!t.dataset.save) return;
        try {
          const id = t.dataset.save;
          const input = document.querySelector(`input[data-word-for="${id}"]`);
          await api.put(`/api/family/magic-words/${id}`, { magicWord: input.value });
          showFlash(document.getElementById("flash"), "Saved");
          await refresh();
        } catch (err) {
          showFlash(document.getElementById("flash"), err.message, true);
        }
      };
    }
    refresh().catch(() => {});
  </script>
</body>
</html>
