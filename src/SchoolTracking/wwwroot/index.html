<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Today — School Nest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Caveat:wght@600;700&family=Chewy&family=Comic+Neue:wght@400;700&family=Courier+Prime:wght@400;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Fredoka:wght@500;600;700&family=Lora:wght@400;600;700&family=Nunito:wght@400;600;700&family=Patrick+Hand&family=Quicksand:wght@400;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/site.css" />
  <link rel="icon" type="image/svg+xml" href="/img/schoolnest.svg" />
  <script src="/js/themes.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/layout.js"></script>
</head>
<body>
  <div class="shell">
    <div class="topbar" id="topbar"></div>
    <div id="flash" hidden></div>

    <div class="today-layout" id="todayLayout">
      <aside class="layout-stage layout-stage-a" aria-hidden="true"></aside>
      <div class="today-content">
        <div class="panel panel-today-required">
          <h1>Today's required work</h1>
          <p id="dayMeta" class="muted"></p>
          <ul class="list today-task-list" id="requiredList"></ul>
        </div>

        <details class="panel panel-optional">
          <summary class="optional-summary">
            <span class="optional-summary-title">Optional work</span>
            <span id="optionalCount" class="optional-summary-count muted"></span>
          </summary>
          <ul class="list optional-task-list" id="optionalList"></ul>
          <form id="optionalForm" class="optional-add-card">
            <div class="optional-add-fields">
              <label>From optional list
                <select id="optActivity"><option value="">— new freeform —</option></select>
              </label>
              <label>New name (if freeform)
                <input id="optName" placeholder="e.g. Free reading" />
              </label>
            </div>
            <div class="optional-add-side">
              <span id="optEffortWrap"></span>
              <button type="submit">Add &amp; complete</button>
            </div>
          </form>
        </details>
      </div>
      <aside class="layout-stage layout-stage-b" aria-hidden="true"></aside>
    </div>
  </div>
  <dialog id="leftoverDialog" class="picker-dialog leftover-dialog">
    <button type="button" class="leftover-close" id="leftoverClose" aria-label="Confirm and close">×</button>
    <h2 id="leftoverTitle">Confirm leftover work</h2>
    <p id="leftoverCopy" class="muted"></p>
    <ul class="list today-task-list leftover-list" id="leftoverList"></ul>
    <div class="leftover-actions">
      <button type="button" id="leftoverConfirm">Confirm</button>
    </div>
  </dialog>
  <script src="/js/app.js"></script>
  <script>
    document.getElementById("optEffortWrap").innerHTML = effortToggle("optEffort", "low");

    const leftoverDialog = document.getElementById("leftoverDialog");
    let leftoverSubmitting = false;

    function formatDay(iso) {
      if (!iso) return "";
      const [y, m, d] = iso.split("-").map(Number);
      return new Date(y, m - 1, d).toLocaleDateString(undefined, {
        weekday: "long", month: "long", day: "numeric"
      });
    }

    function carryoverNote(a) {
      if (a.carryoverKind === "leftover") {
        const when = a.sourceStartedOn ? formatDay(a.sourceStartedOn) : "an earlier day";
        return `<div class="today-carryover">Unfinished from ${escapeHtml(when)}</div>`;
      }
      if (a.carryoverKind === "deferred") {
        const when = a.sourceStartedOn ? formatDay(a.sourceStartedOn) : "an earlier day";
        return `<div class="today-carryover">Deferred from ${escapeHtml(when)}</div>`;
      }
      return "";
    }

    function setEffortToggle(name, value) {
      const input = document.querySelector(`input.effort-toggle-input[name="${name}"]`);
      if (!input) return;
      input.checked = value === "high";
      input.setAttribute("aria-checked", input.checked ? "true" : "false");
    }

    async function load() {
      const me = await requireAuth("student");
      await renderTopbar(me, "today");
      applyTodayBackground(me.activeBackgroundId);
      const flash = document.getElementById("flash");

      const activities = await api.get("/api/family/optional-activities");
      const activitySelect = document.getElementById("optActivity");
      activitySelect.innerHTML = `<option value="">— new freeform —</option>` +
        activities.map(a => `<option value="${a.id}" data-effort="${a.defaultEffort}">${a.name}</option>`).join("");

      const optName = document.getElementById("optName");

      function syncOptionalNameField() {
        const freeform = !activitySelect.value;
        optName.disabled = !freeform;
        if (!freeform) optName.value = "";
      }

      activitySelect.onchange = () => {
        const opt = activitySelect.selectedOptions[0];
        if (opt?.dataset.effort) setEffortToggle("optEffort", opt.dataset.effort);
        syncOptionalNameField();
      };
      syncOptionalNameField();

      leftoverSubmitting = false;
      const data = await api.get("/api/assignments/today");
      const dayMeta = document.getElementById("dayMeta");
      const requiredList = document.getElementById("requiredList");
      const optionalList = document.getElementById("optionalList");
      const optionalCount = document.getElementById("optionalCount");

      const optionalItems = data.optional || [];
      optionalCount.textContent = optionalItems.length
        ? `(${optionalItems.length} today)`
        : "";

      if (data.pendingLeftovers) {
        dayMeta.textContent = data.message || "Confirm leftover work before starting today.";
        requiredList.innerHTML = "";
        requiredList.classList.remove("is-day-done");
        openLeftoverDialog(data.pendingLeftovers);
      } else if (leftoverDialog.open) {
        leftoverDialog.close();
      }

      if (!data.pendingLeftovers && !data.day) {
        dayMeta.textContent = data.message || "Nothing planned.";
        requiredList.innerHTML = "";
        requiredList.classList.remove("is-day-done");
      } else if (data.day) {
        const done = data.day.status === "completed" || data.day.status === "partiallycompleted";
        const todayLabel = formatDay(data.day.today);
        const startedLabel = data.day.startedOn ? formatDay(data.day.startedOn) : "";
        let extra = "";
        if (data.day.status === "completed") extra = " — you are done with required work for this day!";
        else if (data.day.status === "partiallycompleted") extra = " — leftover work moved to the next day.";
        else if (data.day.status === "planned") extra = ` — not started. First checkbox starts ${todayLabel}.`;
        else if (startedLabel) extra = ` — started ${startedLabel}`;
        dayMeta.textContent = `Day slot #${data.day.sequenceIndex} · ${data.day.status}${extra}`;
        requiredList.classList.toggle("is-day-done", done);

        requiredList.innerHTML = data.assignments.map(a => {
          const assigned = a.status === "assigned";
          const completed = a.status === "completed";
          const toggleDisabled = !assigned && !completed;
          const title = `${a.courseName} · ${a.name}`;
          const nameHtml = a.url
            ? `<a class="today-task-name" href="${escapeHtml(a.url)}" target="_blank" rel="noopener">${escapeHtml(title)}</a>`
            : `<span class="today-task-name">${escapeHtml(title)}</span>`;
          const sideAction = assigned
            ? `<button type="button" class="today-task-defer" data-defer="${a.id}">Request deferral</button>`
            : completed
              ? ""
              : `<span class="muted today-task-waiting">Waiting on parent</span>`;
          return `
          <li class="today-task" data-status="${a.status}" data-id="${a.id}">
            <label class="today-task-check">
              <input type="checkbox" class="today-task-checkbox"
                data-complete="${a.id}"
                ${completed ? "checked" : ""}
                ${assigned ? "" : "disabled"}
                aria-label="Mark ${escapeHtml(title)} complete" />
              <span class="today-task-checkbox-ring" aria-hidden="true"></span>
            </label>
            <div class="today-task-body">
              ${nameHtml}
              <div class="today-task-meta muted">${escapeHtml(a.subjectName)}</div>
              ${carryoverNote(a)}
              ${a.description ? `<div class="today-task-desc muted">${escapeHtml(a.description)}</div>` : ""}
            </div>
            <div class="today-task-side">
              ${effortToggle(`effort-${a.id}`, a.effort, { disabled: toggleDisabled })}
              ${sideAction}
            </div>
          </li>`;
        }).join("") || `<li class="muted">No required assignments on this day.</li>`;
      }

      optionalList.innerHTML = optionalItems.map(a => {
        const statusNote = a.countsTowardHours
          ? "Hours counted"
          : a.status === "completed"
            ? "Awaiting parent to approve"
            : "Not completed";
        const action = a.status === "assigned"
          ? `<button data-complete="${a.id}" type="button">Complete</button>`
          : `<button class="secondary" data-effort="${a.id}" type="button">Update effort</button>`;
        return `
        <li class="optional-task" data-status="${a.status}" data-id="${a.id}">
          <div class="optional-task-body">
            <span class="optional-task-name">${a.name}</span>
            <div class="optional-task-meta muted">${statusNote}</div>
          </div>
          <div class="optional-task-side">
            ${effortToggle(`opt-effort-${a.id}`, a.effort)}
            ${action}
          </div>
        </li>`;
      }).join("") || `<li class="muted">No optional work logged for today.</li>`;

      requiredList.onclick = async (e) => {
        const deferBtn = e.target.closest("[data-defer]");
        if (!deferBtn || !requiredList.contains(deferBtn)) return;
        try {
          await api.post(`/api/assignments/${deferBtn.dataset.defer}/defer`, {});
          showFlash(flash, "Deferral requested");
          await load();
        } catch (err) {
          showFlash(flash, err.message, true);
        }
      };

      requiredList.onchange = async (e) => {
        const t = e.target;
        try {
          if (t.classList.contains("today-task-checkbox") && t.dataset.complete && t.checked) {
            const id = t.dataset.complete;
            const effortInput = requiredList.querySelector(`input.effort-toggle-input[name="effort-${id}"]`);
            await api.post(`/api/assignments/${id}/complete`, { effort: effortToggleValue(effortInput) });
            showFlash(flash, "Marked complete");
            await load();
          } else if (t.classList.contains("effort-toggle-input") && t.name?.startsWith("effort-")) {
            t.setAttribute("aria-checked", t.checked ? "true" : "false");
            const card = t.closest(".today-task");
            if (card?.dataset.status === "completed") {
              const id = t.name.slice("effort-".length);
              await api.patch(`/api/assignments/${id}/effort`, { effort: effortToggleValue(t) });
              showFlash(flash, "Effort updated");
            }
          }
        } catch (err) {
          showFlash(flash, err.message, true);
          await load();
        }
      };

      optionalList.onclick = async (e) => {
        const t = e.target;
        try {
          if (t.dataset.complete) {
            const id = t.dataset.complete;
            const effortInput = optionalList.querySelector(`input.effort-toggle-input[name="opt-effort-${id}"]`);
            await api.post(`/api/assignments/${id}/complete`, { effort: effortToggleValue(effortInput) });
            showFlash(flash, "Marked complete");
            await load();
          } else if (t.dataset.effort) {
            const id = t.dataset.effort;
            const effortInput = optionalList.querySelector(`input.effort-toggle-input[name="opt-effort-${id}"]`);
            await api.patch(`/api/assignments/${id}/effort`, { effort: effortToggleValue(effortInput) });
            showFlash(flash, "Effort updated");
            await load();
          }
        } catch (err) {
          showFlash(flash, err.message, true);
        }
      };
    }

    function openLeftoverDialog(pending) {
      const started = pending.day?.startedOn;
      const when = started ? formatDay(started) : "the previous school day";
      document.getElementById("leftoverTitle").textContent = "Confirm leftover work";
      document.getElementById("leftoverCopy").textContent =
        `These were not checked off on ${when}. Check anything you finished and forgot to mark. Closing this confirms the rest were not done.`;
      const list = document.getElementById("leftoverList");
      list.innerHTML = (pending.assignments || []).map(a => {
        const title = `${a.courseName} · ${a.name}`;
        return `
          <li class="today-task leftover-item" data-id="${a.id}">
            <label class="today-task-check">
              <input type="checkbox" class="today-task-checkbox leftover-done"
                data-leftover-id="${a.id}"
                aria-label="Mark ${escapeHtml(title)} done for ${escapeHtml(when)}" />
              <span class="today-task-checkbox-ring" aria-hidden="true"></span>
            </label>
            <div class="today-task-body">
              <span class="today-task-name">${escapeHtml(title)}</span>
              <div class="today-task-meta muted">${escapeHtml(a.subjectName)}</div>
            </div>
            <div class="today-task-side">
              ${effortToggle(`leftover-effort-${a.id}`, a.effort)}
            </div>
          </li>`;
      }).join("") || `<li class="muted">Nothing left to confirm.</li>`;
      if (!leftoverDialog.open)
        leftoverDialog.showModal();
    }

    async function submitLeftovers() {
      if (leftoverSubmitting || !leftoverDialog.open) return;
      leftoverSubmitting = true;
      const flash = document.getElementById("flash");
      const completedIds = [...leftoverDialog.querySelectorAll("input.leftover-done:checked")]
        .map(el => Number(el.dataset.leftoverId));
      const efforts = {};
      leftoverDialog.querySelectorAll("input.leftover-done").forEach(el => {
        const id = el.dataset.leftoverId;
        const effortInput = leftoverDialog.querySelector(
          `input.effort-toggle-input[name="leftover-effort-${id}"]`);
        efforts[id] = effortToggleValue(effortInput);
      });
      try {
        await api.post("/api/assignments/today/resolve-leftovers", { completedIds, efforts });
        leftoverDialog.close();
        await load();
      } catch (err) {
        leftoverSubmitting = false;
        showFlash(flash, err.message, true);
      }
    }

    leftoverDialog.addEventListener("cancel", e => {
      e.preventDefault();
      submitLeftovers();
    });
    leftoverDialog.addEventListener("click", e => {
      if (e.target === leftoverDialog) submitLeftovers();
    });
    document.getElementById("leftoverConfirm").onclick = submitLeftovers;
    document.getElementById("leftoverClose").onclick = submitLeftovers;

    document.getElementById("optionalForm").onsubmit = async (e) => {
      e.preventDefault();
      const flash = document.getElementById("flash");
      try {
        const activityId = document.getElementById("optActivity").value;
        const body = {
          effort: effortToggleValue(document.querySelector('input.effort-toggle-input[name="optEffort"]')),
          completeImmediately: true
        };
        if (activityId) {
          body.optionalActivityId = Number(activityId);
        } else {
          body.name = document.getElementById("optName").value;
          if (!body.name) throw new Error("Name required for freeform");
        }
        await api.post("/api/assignments/optional", body);
        showFlash(flash, "Optional work added (awaiting parent acknowledgment for hours)");
        document.getElementById("optName").value = "";
        await load();
      } catch (err) {
        showFlash(flash, err.message, true);
      }
    };

    load().catch(err => {
      if (err.message !== "Not authenticated" && err.message !== "Wrong role") {
        showFlash(document.getElementById("flash"), err.message, true);
      }
    });
  </script>
</body>
</html>
