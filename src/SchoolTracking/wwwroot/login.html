<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login — SchoolTracking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Caveat:wght@600;700&family=Comic+Neue:wght@400;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&family=Quicksand:wght@400;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/site.css" />
  <script src="/js/themes.js"></script>
  <script src="/js/theme.js"></script>
</head>
<body>
  <div class="shell login-wrap">
    <div class="panel">
      <h1>SchoolTracking</h1>
      <div id="flash" hidden></div>
      <form id="loginForm" class="row">
        <label>Who are you?
          <select id="userId" required></select>
        </label>
        <label>Magic word
          <input id="magicWord" type="password" autocomplete="current-password" required />
        </label>
        <button type="submit">Enter</button>
      </form>
    </div>
  </div>
  <script src="/js/app.js"></script>
  <script>
    (async function () {
      const flash = document.getElementById("flash");
      try {
        const me = await api.get("/api/auth/me");
        location.href = me.role === "parent" ? "/planner.html" : "/index.html";
        return;
      } catch { /* not logged in */ }

      const users = await api.get("/api/auth/users");
      const select = document.getElementById("userId");
      select.innerHTML = users.map(u =>
        `<option value="${u.id}">${u.displayName}</option>`
      ).join("");

      document.getElementById("loginForm").onsubmit = async (e) => {
        e.preventDefault();
        try {
          const body = {
            userId: Number(select.value),
            magicWord: document.getElementById("magicWord").value
          };
          const me = await api.post("/api/auth/login", body);
          location.href = me.role === "parent" ? "/planner.html" : "/index.html";
        } catch (err) {
          showFlash(flash, err.message || "Login failed", true);
        }
      };
    })();
  </script>
</body>
</html>
