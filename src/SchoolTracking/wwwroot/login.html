<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login — SchoolNest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Caveat:wght@600;700&family=Chewy&family=Comic+Neue:wght@400;700&family=Courier+Prime:wght@400;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Fredoka:wght@500;600;700&family=Lora:wght@400;600;700&family=Nunito:wght@400;600;700&family=Patrick+Hand&family=Quicksand:wght@400;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/site.css" />
  <link rel="icon" type="image/svg+xml" href="/img/schoolnest.svg" />
  <script src="/js/themes.js"></script>
  <script src="/js/theme.js"></script>
</head>
<body class="login-body">
  <main class="login-card">
    <aside class="login-side">
      <div class="login-wordmark">SchoolNest</div>
      <div class="login-owl" id="loginOwl" aria-hidden="true"></div>
      <h2 class="login-tagline">Today's tasks tucked together.</h2>
      <p class="login-tagline-sub muted">Schedules, assignments, and little victories&mdash;all in one cozy nest.</p>
    </aside>
    <section class="login-main">
      <p class="login-eyebrow">Welcome home</p>
      <h1 class="login-title">Ready for school?</h1>
      <p class="login-intro muted">Choose your profile, then enter your magic word.</p>
      <div id="flash" hidden></div>
      <form id="loginForm">
        <fieldset class="login-people">
          <legend>Who are you?</legend>
          <div class="login-people-grid" id="peopleGrid"></div>
        </fieldset>
        <label class="login-magic-label" for="magicWord">Magic word</label>
        <div class="login-magic">
          <input id="magicWord" type="password" autocomplete="current-password" required />
          <button type="button" class="login-show" id="showToggle" aria-controls="magicWord">Show</button>
        </div>
        <p class="login-hint muted">Ask a grown-up if you've forgotten it.</p>
        <button type="submit" class="login-submit">Enter SchoolNest <span aria-hidden="true">&rarr;</span></button>
      </form>
    </section>
  </main>
  <script src="/js/app.js"></script>
  <script>
    document.getElementById("loginOwl").innerHTML = snLogo("login-owl-mark");

    const AVATAR_HUES = [
      "#b08968", "#5b7fa6", "#8a63c9", "#7a9b76",
      "#a4706b", "#b2648a", "#6f7fb2", "#a68a4f"
    ];

    function initialsFor(name, allNames) {
      const first = name.charAt(0).toUpperCase();
      const clash = allNames.filter(n => n.charAt(0).toUpperCase() === first).length > 1;
      return clash ? first + name.slice(1, 2).toLowerCase() : first;
    }

    (async function () {
      const flash = document.getElementById("flash");
      try {
        const me = await api.get("/api/auth/me");
        location.href = me.role === "parent" ? "/planner.html" : "/index.html";
        return;
      } catch { /* not logged in */ }

      const users = await api.get("/api/auth/users");
      const names = users.map(u => u.displayName);
      const grid = document.getElementById("peopleGrid");
      grid.innerHTML = users.map((u, i) => `
        <label class="login-person">
          <input type="radio" name="userId" value="${u.id}" required />
          <span class="login-avatar" style="--avatar-hue: ${AVATAR_HUES[i % AVATAR_HUES.length]}">${initialsFor(u.displayName, names)}</span>
          <span class="login-person-name">${u.displayName}</span>
        </label>
      `).join("");

      const magic = document.getElementById("magicWord");

      // Jump to the magic word once a profile is picked.
      grid.addEventListener("change", () => magic.focus());

      const toggle = document.getElementById("showToggle");
      toggle.onclick = () => {
        const show = magic.type === "password";
        magic.type = show ? "text" : "password";
        toggle.textContent = show ? "Hide" : "Show";
      };

      document.getElementById("loginForm").onsubmit = async (e) => {
        e.preventDefault();
        const picked = grid.querySelector("input[name=userId]:checked");
        if (!picked) {
          showFlash(flash, "Choose who you are first.", true);
          return;
        }
        try {
          const body = {
            userId: Number(picked.value),
            magicWord: magic.value
          };
          const me = await api.post("/api/auth/login", body);
          location.href = me.role === "parent" ? "/planner.html" : "/index.html";
        } catch (err) {
          showFlash(flash, err.message || "Login failed", true);
        }
      };
    })();
  </script>
</body>
</html>
